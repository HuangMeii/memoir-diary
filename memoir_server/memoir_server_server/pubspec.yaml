name: memoir_server_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  serverpod: 4.0.4
  serverpod_cloud_storage: 4.0.4
  serverpod_cloud_storage_s3_compat: 4.0.4
  # Password hashing parity with the existing FastAPI bcrypt hashes.
  bcrypt: ^1.1.3
  # Open-Meteo forecast calls.
  http: ^1.2.2

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.0.4
  test: ^1.25.5
  # Used by tool/sync_from_neon.dart to copy data from the Neon (staging)
  # database into the local embedded PostgreSQL.
  postgres: ^3.5.20
  yaml: ^3.1.2
  path: ^1.9.0

