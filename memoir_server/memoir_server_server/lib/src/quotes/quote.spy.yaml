### Motivational / educational quote. Null userId = system seed quote.
class: Quote
table: quotes
fields:
  id: UuidValue?, defaultPersist=random_v7
  userId: UuidValue?
  text: String
  author: String?
  source: String?
  category: String?
  isActive: bool, default=true
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
