### Daily health tracking. One row per user per day.
class: HealthLog
table: health_logs
fields:
  id: UuidValue?, defaultPersist=random_v7
  userId: UuidValue, relation(parent=users, onDelete=Cascade)
  logDate: DateTime, unique(per=userId)
  steps: int?
  workoutMinutes: int?
  waterMl: int?
  sleepHours: double?
  weightKg: double?
  note: String?
  ### Workout (ghi nhận nhanh tập luyện)
  workoutType: String?
  workoutIntensity: String?
  ### Sleep (ghi nhận nhanh giấc ngủ)
  sleepBedtime: String?
  sleepWake: String?
  sleepDeepMinutes: int?
  sleepQuality: String?
  sleepNote: String?
  createdAt: DateTime, default=now
