services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: memoir_server
      POSTGRES_PASSWORD: "lxxx4c4pUjmS0yoStW3FF2W7XkZxMtnh"
    volumes:
      - memoir_server_data:/var/lib/postgresql/data


  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: memoir_server_test
      POSTGRES_PASSWORD: "TII7ST3eN-FweAMsTOVJO9AE_5V0y3wP"
    volumes:
      - memoir_server_test_data:/var/lib/postgresql/data

  # Routing — chỉ dữ liệu Việt Nam (dựng dữ liệu theo docs/06-setup-deploy.md §5.1).
  # Kẹt ở bước extract khi chưa có dữ liệu: service vẫn định nghĩa ở đây để
  # `docker compose up osrm_car` là chạy, nhưng lần đầu phải build graph trước.
  osrm_car:
    image: ghcr.io/project-osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/vietnam-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm/vn:/data

  # Hai profile còn lại (bike 5001, foot 5002) dựng từ cùng file .pbf với
  # /opt/bicycle.lua và /opt/foot.lua — xem docs/06-setup-deploy.md §5.1.
  # osrm_bike:
  #   image: ghcr.io/project-osrm/osrm-backend
  #   command: osrm-routed --algorithm mld /data/vietnam-latest-bike.osrm
  #   ports:
  #     - "5001:5000"
  #   volumes:
  #     - ./osrm/vn:/data
  # osrm_foot:
  #   image: ghcr.io/project-osrm/osrm-backend
  #   command: osrm-routed --algorithm mld /data/vietnam-latest-foot.osrm
  #   ports:
  #     - "5002:5000"
  #   volumes:
  #     - ./osrm/vn:/data


volumes:
  memoir_server_data:
  memoir_server_test_data:
