# This is the configuration file for your staging environment. The staging
# environment is meant to resemble the production environment as much as
# possible and may connect to production databases services and data. You use it
# for final testing before deploying the production server.
#
# Typically, you will want to route the traffic through a load balancer
# which adds SSL security through https. If you use Serverpod's standard
# Terraform scripts to deploy your server, all you need to change in
# this file is the examplepod.com domain name.

# Configuration for the main API server.
apiServer:
  port: 8080
  publicHost: api-staging.examplepod.com
  publicPort: 443
  publicScheme: https

# Configuration for the Insights server.
insightsServer:
  port: 8081
  publicHost: insights-staging.examplepod.com
  publicPort: 443
  publicScheme: https


# This is the database setup for your servers. Memoir staging connects to a
# Neon PostgreSQL (serverless) branch. Copy the values from the Neon Console
# (Connect dialog -> "Pooled connection"), and keep the password out of this
# file: it lives in config/passwords.yaml (staging.database) or in the
# SERVERPOD_DATABASE_PASSWORD environment variable on the host.
database:
  host: ep-mute-cloud-b3nu5yf8-pooler.c-4.ap-southeast-1.aws.neon.tech
  port: 5432
  name: neondb
  user: neondb_owner
  requireSsl: true
  #isUnixSocket: true # defaults to false
  #maxConnectionCount: 10 # Defaults to 10, a negative or null value removes the limit


maxRequestSize: 524288 # The maximum size of requests allowed in bytes

sessionLogs:
# persistentEnabled: true
# consoleEnabled: true
# consoleLogFormat: json # Defaults to "json", options are "text" or "json"

#futureCall:
#  enabled: true # Defaults to true, set to false to disable scheduling and running future calls
#  executionEnabled: true # Defaults to true
#  concurrencyLimit: 1 # Defaults to 1, a negative or null value removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000

# Recommended when serving web clients: keeps auth tokens in httpOnly
# cookies. Without this, web tokens live in JavaScript-readable storage,
# where any XSS can steal them. Web clients opt in with
# `client.cookieAuth = true`. Requires `allowedOrigins`; browsers from
# origins not in the list lose cross-origin access, including to public
# endpoints.
#authCookie:
#  sameSite: lax # Defaults to "lax", options are "strict" or "none"
#  #name: serverpod_auth # Defaults to "serverpod_auth"
#  #refreshName: serverpod_auth_refresh # Defaults to "<name>_refresh"
#  #domain: examplepod.com # Defaults to host-only; set to share across subdomains
#  #path: / # Defaults to "/"
#  #secure: true # Defaults to true; the cookie is only sent over https
#allowedOrigins:
#  - https://app-staging.examplepod.com # The origin serving your Flutter web app
