name: memoir_app
description: "Memoir - ung dung nhat ky daily voi mood, weather va suc khoe."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # HTTP
  dio: ^5.7.0

  # Secure token storage (multi-user auth)
  flutter_secure_storage: ^9.2.2

  # Local device info -> need these for image picker on web + mobile
  image_picker: ^1.1.2

  # Date helpers
  intl: ^0.19.0

  # SVG rendering for the Figma-exported brand mark and illustration.
  flutter_svg: ^2.0.10

  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0

  # Route weather planner: a real, tiled map with pan/zoom and tap-to-pick.
  # OpenStreetMap tiles need no API key, like the weather and routing providers.
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Generated Serverpod client SDK for the Dart backend (memoir_server).
  # Lets the app talk to Serverpod through ServerpodDataSource.
  memoir_server_client:
    path: ../memoir_server/memoir_server_client
  serverpod_client: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/illustrations/

  fonts:
    # Typefaces from the Figma design: Lora for brand/headings, Inter for UI.
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf