name: memoir_app
description: "Memoir - ung dung nhat ky daily voi mood, weather va suc khoe."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # HTTP
  dio: ^5.7.0

  # Secure token storage (multi-user auth)
  flutter_secure_storage: ^9.2.2

  # Local device info -> need these for image picker on web + mobile
  image_picker: ^1.1.2

  # Date helpers
  intl: ^0.19.0

  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true