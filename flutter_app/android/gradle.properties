org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The Kotlin incremental compilation caches cannot be closed on JDK 25
# ("Could not close incremental caches ... class-fq-name-to-source.tab"),
# which breaks the release build of image_picker_android. The project targets
# Java 17 in build.gradle.kts, so turning incremental compilation off is safe
# and only costs a little build time.
kotlin.incremental=false
